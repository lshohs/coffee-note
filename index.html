<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5EFE3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>원두 시음 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5EFE3;
  --card:#FFFCF6;
  --ink:#2E2419;
  --muted:#8A7B68;
  --line:#E3D9C6;
  --roast:#6F4518;
  --roast-soft:#B08A5E;
  --leaf:#4A5D3A;
  --alert:#9B3B22;
  --serif:'Noto Serif KR',Georgia,serif;
  --sans:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.6;
  padding:0 0 64px;
}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}

/* ---------- header ---------- */
header{padding:34px 0 22px;text-align:center}
header .mark{
  font-family:var(--serif);font-size:11px;letter-spacing:.42em;
  color:var(--roast-soft);text-transform:uppercase;margin-bottom:10px
}
header h1{
  font-family:var(--serif);font-weight:700;font-size:29px;
  margin:0;letter-spacing:-.01em
}
header .stats{
  margin-top:12px;font-size:13px;color:var(--muted);
  display:flex;justify-content:center;gap:18px;flex-wrap:wrap
}
header .stats b{color:var(--roast);font-weight:700}

/* ---------- card ---------- */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:20px 18px;
  margin-bottom:20px;
  box-shadow:0 1px 0 rgba(46,36,25,.04);
}
.card h2{
  font-family:var(--serif);font-size:16px;font-weight:600;
  margin:0 0 16px;display:flex;align-items:center;justify-content:space-between
}
.card h2 .sub{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:400}

/* ---------- form ---------- */
label{display:block;font-size:12.5px;color:var(--muted);margin:0 0 6px;letter-spacing:.02em}
.field{margin-bottom:14px}
input[type=text],input[type=date],textarea,select{
  width:100%;padding:11px 12px;
  border:1px solid var(--line);border-radius:9px;
  background:#fff;color:var(--ink);
  font-family:var(--sans);font-size:15px;
  transition:border-color .15s;
}
textarea{resize:vertical;min-height:64px;line-height:1.55}
input:focus,textarea:focus,select:focus{outline:2px solid var(--roast-soft);outline-offset:1px;border-color:transparent}
.row2{display:flex;gap:12px}
.row2 .field{flex:1;min-width:0}

/* ---------- bean rating ---------- */
.beans{display:flex;gap:7px;padding-top:2px}
.beanbtn{
  background:none;border:none;padding:3px;cursor:pointer;line-height:0;border-radius:6px
}
.beanbtn:focus-visible{outline:2px solid var(--roast-soft)}
.beanbtn svg{width:27px;height:27px;display:block}
.beanbtn .shell{fill:#EDE3D2;stroke:var(--line);stroke-width:1.2;transition:fill .12s}
.beanbtn .crack{stroke:#D8C9B0;stroke-width:1.6;fill:none;transition:stroke .12s}
.beanbtn.on .shell{fill:var(--roast)}
.beanbtn.on .crack{stroke:#E8D7BE}

/* ---------- buttons ---------- */
.btn{
  width:100%;padding:13px;border:none;border-radius:10px;
  background:var(--roast);color:#FFF8EC;
  font-family:var(--sans);font-size:15px;font-weight:700;letter-spacing:.02em;
  cursor:pointer;transition:opacity .15s
}
.btn:active{opacity:.82}
.btn.ghost{background:none;color:var(--muted);border:1px solid var(--line);font-weight:500}
.btnrow{display:flex;gap:10px;margin-top:4px}

/* ---------- toolbar ---------- */
.toolbar{display:flex;gap:10px;margin-bottom:14px}
.toolbar input{flex:1}
.toolbar select{width:118px;flex:none}

/* ---------- entries ---------- */
.entry{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:15px 16px;margin-bottom:11px;position:relative
}
.entry.pending{opacity:.62}
.entry.failed{border-color:var(--alert)}
.entry .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.entry .bean{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:-.01em}
.entry .date{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.entry .rate{margin:7px 0 9px;display:flex;gap:4px}
.entry .rate svg{width:15px;height:15px}
.entry .rate .shell{fill:var(--roast)}
.entry .rate .off .shell{fill:#EDE3D2}
.entry .rate .crack{stroke:#E8D7BE;stroke-width:1.6;fill:none}
.entry .rate .off .crack{stroke:#D8C9B0}
.entry dl{margin:0;display:grid;grid-template-columns:56px 1fr;gap:5px 10px;font-size:14px}
.entry dt{color:var(--muted);font-size:12px;padding-top:2px}
.entry dd{margin:0;white-space:pre-wrap;word-break:break-word}
.entry .acts{margin-top:11px;display:flex;gap:14px;border-top:1px solid var(--line);padding-top:9px}
.entry .acts button{
  background:none;border:none;padding:0;font-family:var(--sans);font-size:12.5px;
  color:var(--muted);cursor:pointer
}
.entry .acts button:hover{color:var(--roast)}
.entry .acts .del:hover{color:var(--alert)}
.tag{
  display:inline-block;font-size:11.5px;color:var(--leaf);
  border:1px solid #CFD6C4;background:#F3F6EE;border-radius:999px;padding:1px 9px
}
.badge{
  position:absolute;top:13px;right:14px;font-size:11px;
  color:var(--muted);letter-spacing:.02em
}
.badge.err{color:var(--alert);cursor:pointer;text-decoration:underline}

/* ---------- states ---------- */
.empty{
  text-align:center;padding:38px 20px;color:var(--muted);
  border:1px dashed var(--line);border-radius:12px;background:rgba(255,252,246,.5)
}
.empty p{margin:0;font-family:var(--serif);font-size:15px}
.skel{height:88px;border-radius:12px;background:linear-gradient(90deg,#F0E8DA,#F7F1E6,#F0E8DA);
  background-size:200% 100%;animation:sh 1.3s infinite;margin-bottom:11px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.banner{
  background:#FBEDE8;border:1px solid #E8C4B6;color:#7A3018;
  border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:18px;line-height:1.5
}
.banner b{display:block;margin-bottom:3px}
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(80px);
  background:var(--ink);color:#F7F1E6;padding:11px 20px;border-radius:999px;
  font-size:13.5px;transition:transform .28s cubic-bezier(.2,.9,.3,1);z-index:20;
  max-width:88vw;text-align:center
}
.toast.show{transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="bean" viewBox="0 0 24 24">
    <ellipse class="shell" cx="12" cy="12" rx="7.4" ry="9.6" transform="rotate(-28 12 12)"/>
    <path class="crack" d="M8.4 17.6c2.6-1.4 3.4-3.6 3.2-5.7-.2-2.1-1.2-4-3.3-5.3"
          transform="rotate(-28 12 12)" stroke-linecap="round"/>
  </symbol>
</svg>

<div class="wrap">

  <header>
    <div class="mark">Coffee Note</div>
    <h1>원두 시음 기록</h1>
    <div class="stats" id="stats"></div>
  </header>

  <div id="banner"></div>

  <!-- 입력 -->
  <section class="card">
    <h2><span id="formTitle">오늘 마신 원두</span><span class="sub" id="formHint">6칸이면 끝</span></h2>

    <div class="row2">
      <div class="field">
        <label for="f-date">날짜</label>
        <input type="date" id="f-date">
      </div>
      <div class="field">
        <label for="f-place">마신 장소</label>
        <input type="text" id="f-place" placeholder="집, 카페 이름">
      </div>
    </div>

    <div class="field">
      <label for="f-bean">원두명</label>
      <input type="text" id="f-bean" placeholder="에티오피아 코케 하니">
    </div>

    <div class="field">
      <label for="f-cup">컵노트 <span style="color:#B7A891">봉투에 적힌 것</span></label>
      <input type="text" id="f-cup" placeholder="자몽, 홍차, 재스민">
    </div>

    <div class="field">
      <label for="f-my">내 느낌</label>
      <textarea id="f-my" placeholder="식으니까 단맛이 확 올라온다. 산미는 생각보다 얌전."></textarea>
    </div>

    <div class="field">
      <label>평점</label>
      <div class="beans" id="rating" role="group" aria-label="평점"></div>
    </div>

    <div class="btnrow">
      <button class="btn" id="saveBtn">기록 저장</button>
      <button class="btn ghost" id="cancelBtn" style="display:none;width:96px">취소</button>
    </div>
  </section>

  <!-- 목록 -->
  <section>
    <div class="toolbar">
      <input type="text" id="q" placeholder="원두명, 장소, 노트 검색">
      <select id="sort">
        <option value="new">최신순</option>
        <option value="old">오래된순</option>
        <option value="rate">평점순</option>
      </select>
    </div>
    <div id="list"></div>
  </section>

</div>

<div class="toast" id="toast"></div>

<script>
/* ===================================================================
   설정 — 이 두 줄만 본인 것으로 유지하면 됩니다
   =================================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbz14cVemZ2_v-f51ATGV2F921MhOfBGVafAK9j9rqaT4wMzgCg709nMmcWUxbOVnqO6/exec';
const SECRET  = 'ohscoffeenote';   // ← Apps Script 2번째 줄과 똑같이
/* =================================================================== */

const $ = id => document.getElementById(id);
let records = [];
let rating = 0;
let editingId = null;

/* ---------- 서버 통신 ---------- */
async function api(body){
  const res = await fetch(API_URL, {
    method:'POST',
    // text/plain 이어야 브라우저가 사전요청(preflight)을 보내지 않습니다.
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({secret:SECRET}, body)),
    redirect:'follow'
  });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || 'UNKNOWN');
  return data;
}

/* ---------- 화면 그리기 ---------- */
function beanSvg(on){
  return '<svg class="'+(on?'':'off')+'" viewBox="0 0 24 24" aria-hidden="true"><use href="#bean"/></svg>';
}

function buildRating(){
  const box = $('rating');
  box.innerHTML = '';
  for(let i=1;i<=5;i++){
    const b = document.createElement('button');
    b.type='button'; b.className='beanbtn'+(i<=rating?' on':'');
    b.setAttribute('aria-label', i+'점');
    b.innerHTML = '<svg viewBox="0 0 24 24"><use href="#bean"/></svg>';
    b.onclick = () => { rating = (rating===i? i-1 : i); buildRating(); };
    box.appendChild(b);
  }
}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function renderStats(){
  const done = records.filter(r=>!r._failed);
  const rated = done.filter(r=>Number(r.rating)>0);
  const avg = rated.length ? (rated.reduce((s,r)=>s+Number(r.rating),0)/rated.length).toFixed(1) : '—';
  $('stats').innerHTML = '기록 <b>'+done.length+'</b>잔 &nbsp;·&nbsp; 평균 <b>'+avg+'</b>';
}

function renderList(){
  const q = $('q').value.trim().toLowerCase();
  const sort = $('sort').value;
  let rows = records.slice();

  if(q){
    rows = rows.filter(r =>
      [r.bean,r.place,r.cupNote,r.myNote].some(v => String(v||'').toLowerCase().includes(q)));
  }
  rows.sort((a,b) => {
    if(sort==='rate') return Number(b.rating||0) - Number(a.rating||0) || String(b.date).localeCompare(String(a.date));
    if(sort==='old')  return String(a.date).localeCompare(String(b.date));
    return String(b.date).localeCompare(String(a.date));
  });

  const list = $('list');
  if(!rows.length){
    list.innerHTML = '<div class="empty"><p>'+
      (q ? '검색 결과가 없습니다.' : '아직 기록이 없습니다.<br>오늘 마신 한 잔부터 적어보세요.')+'</p></div>';
    renderStats();
    return;
  }

  list.innerHTML = rows.map(r => {
    let badge = '';
    if(r._pending) badge = '<span class="badge">저장 중</span>';
    if(r._failed)  badge = '<span class="badge err" data-retry="'+esc(r.id)+'">저장 실패 · 다시 시도</span>';
    const stars = [1,2,3,4,5].map(i => beanSvg(i<=Number(r.rating||0))).join('');
    let dl = '';
    if(r.cupNote) dl += '<dt>컵노트</dt><dd><span class="tag">'+esc(r.cupNote)+'</span></dd>';
    if(r.myNote)  dl += '<dt>내 느낌</dt><dd>'+esc(r.myNote)+'</dd>';
    if(r.place)   dl += '<dt>장소</dt><dd>'+esc(r.place)+'</dd>';

    return '<article class="entry'+(r._pending?' pending':'')+(r._failed?' failed':'')+'">'
      + badge
      + '<div class="top"><span class="bean">'+esc(r.bean||'(원두명 없음)')+'</span>'
      + '<span class="date">'+esc(r.date)+'</span></div>'
      + '<div class="rate">'+stars+'</div>'
      + (dl ? '<dl>'+dl+'</dl>' : '')
      + (r._pending||r._failed ? '' :
         '<div class="acts"><button data-edit="'+esc(r.id)+'">수정</button>'
         +'<button class="del" data-del="'+esc(r.id)+'">삭제</button></div>')
      + '</article>';
  }).join('');
  renderStats();
}

/* ---------- 저장 ---------- */
function readForm(){
  return {
    date: $('f-date').value,
    bean: $('f-bean').value.trim(),
    cupNote: $('f-cup').value.trim(),
    myNote: $('f-my').value.trim(),
    place: $('f-place').value.trim(),
    rating: rating
  };
}

function clearForm(){
  $('f-date').value = todayStr();
  ['f-bean','f-cup','f-my','f-place'].forEach(id => $(id).value='');
  rating = 0; buildRating();
  editingId = null;
  $('formTitle').textContent = '오늘 마신 원두';
  $('formHint').textContent = '6칸이면 끝';
  $('saveBtn').textContent = '기록 저장';
  $('cancelBtn').style.display = 'none';
}

async function save(){
  const d = readForm();
  if(!d.bean){ toast('원두명을 적어주세요'); $('f-bean').focus(); return; }
  if(!d.date){ toast('날짜를 골라주세요'); return; }

  if(editingId){
    const idx = records.findIndex(r=>r.id===editingId);
    const backup = records[idx];
    records[idx] = Object.assign({}, backup, d, {_pending:true});
    const id = editingId;
    clearForm(); renderList();
    try{
      await api({action:'update', id:id, data:d});
      const i = records.findIndex(r=>r.id===id);
      delete records[i]._pending; renderList(); toast('수정했습니다');
    }catch(e){
      const i = records.findIndex(r=>r.id===id);
      records[i] = backup; renderList(); toast('수정 실패 — ' + e.message);
    }
    return;
  }

  const tmp = 'tmp' + Date.now();
  records.unshift(Object.assign({id:tmp, _pending:true}, d));
  clearForm(); renderList();
  window.scrollTo({top:0, behavior:'smooth'});

  try{
    const res = await api({action:'add', data:d});
    const r = records.find(x=>x.id===tmp);
    r.id = res.id; delete r._pending;
    renderList(); toast('저장했습니다');
  }catch(e){
    const r = records.find(x=>x.id===tmp);
    r._pending = false; r._failed = true; r._data = d;
    renderList(); toast('저장 실패 — ' + e.message);
  }
}

async function retry(tmpId){
  const r = records.find(x=>x.id===tmpId);
  if(!r) return;
  r._failed = false; r._pending = true; renderList();
  try{
    const res = await api({action:'add', data:r._data});
    r.id = res.id; delete r._pending; delete r._data;
    renderList(); toast('저장했습니다');
  }catch(e){
    r._pending = false; r._failed = true; renderList(); toast('여전히 실패 — ' + e.message);
  }
}

async function del(id){
  const r = records.find(x=>x.id===id);
  if(!r) return;
  if(!confirm('"'+(r.bean||'이 기록')+'" 기록을 삭제할까요?')) return;
  const idx = records.indexOf(r);
  records.splice(idx,1); renderList();
  try{
    await api({action:'delete', id:id}); toast('삭제했습니다');
  }catch(e){
    records.splice(idx,0,r); renderList(); toast('삭제 실패 — ' + e.message);
  }
}

function edit(id){
  const r = records.find(x=>x.id===id);
  if(!r) return;
  editingId = id;
  $('f-date').value = r.date || todayStr();
  $('f-bean').value = r.bean || '';
  $('f-cup').value  = r.cupNote || '';
  $('f-my').value   = r.myNote || '';
  $('f-place').value= r.place || '';
  rating = Number(r.rating||0); buildRating();
  $('formTitle').textContent = '기록 수정';
  $('formHint').textContent = r.bean || '';
  $('saveBtn').textContent = '수정 저장';
  $('cancelBtn').style.display = 'block';
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------- 유틸 ---------- */
function todayStr(){
  const d = new Date(); const p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
let toastTimer;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ---------- 시작 ---------- */
async function load(){
  $('list').innerHTML = '<div class="skel"></div><div class="skel"></div>';
  try{
    const res = await api({action:'list'});
    records = res.rows || [];
    $('banner').innerHTML = '';
    renderList();
  }catch(e){
    $('list').innerHTML = '';
    $('banner').innerHTML = '<div class="banner"><b>시트에 연결하지 못했습니다</b>'
      + '오류: ' + esc(e.message) + '<br>'
      + 'API 주소, SECRET 문자열, 배포 시 액세스 권한(모든 사용자)을 확인해 주세요.</div>';
    renderStats();
  }
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-edit],[data-del],[data-retry]');
  if(!t) return;
  if(t.dataset.edit)  edit(t.dataset.edit);
  if(t.dataset.del)   del(t.dataset.del);
  if(t.dataset.retry) retry(t.dataset.retry);
});
$('saveBtn').onclick = save;
$('cancelBtn').onclick = () => { clearForm(); renderList(); };
$('q').oninput = renderList;
$('sort').onchange = renderList;

clearForm();
load();
</script>
</body>
</html>
