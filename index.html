<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F0E4">
<title>커피 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F0E4;
  --card:#FFFDF8;
  --ink:#2E2622;
  --muted:#8C7C6B;
  --line:#E4DACA;
  --accent:#7C4A2A;
  --bean:#B07C3F;
  --danger:#A3452F;
  --radius:14px;
  --serif:'Nanum Myeongjo',"Apple SD Gothic Neo",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}

/* ── 헤더 ───────────────────────── */
header{
  padding:22px 20px 14px;
  border-bottom:1px solid var(--line);
  background:var(--paper);
}
header h1{
  margin:0;
  font-family:var(--serif);
  font-weight:800;
  font-size:25px;
  letter-spacing:-.01em;
}
header p{
  margin:4px 0 0;
  font-size:12.5px;
  color:var(--muted);
  letter-spacing:.02em;
}

/* ── 화면 ───────────────────────── */
main{padding:18px 16px 24px;max-width:640px;margin:0 auto}
.view{display:none}
.view.on{display:block}

/* ── 폼 ─────────────────────────── */
.field{margin-bottom:16px}
label.lb{
  display:block;
  font-size:12.5px;
  font-weight:700;
  color:var(--muted);
  letter-spacing:.04em;
  margin-bottom:6px;
}
input[type=text],input[type=date],textarea,select{
  width:100%;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:10px;
  padding:11px 12px;
  outline:none;
}
input:focus,textarea:focus,select:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(124,74,42,.10);
}
textarea{resize:vertical;min-height:76px;line-height:1.65}

/* ── 평점(원두 알) ──────────────── */
.rating{display:flex;gap:6px}
.beanbtn{
  background:none;border:none;padding:4px;line-height:0;
  border-radius:8px;
}
.beanbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.beanbtn svg{width:30px;height:30px}
.beanbtn .shell{fill:var(--line);stroke:none}
.beanbtn .crack{stroke:var(--paper);stroke-width:1.6;fill:none}
.beanbtn.on .shell{fill:var(--bean)}
.beanbtn.on .crack{stroke:#F3E7D4}
.rate-txt{margin-left:8px;align-self:center;font-size:13px;color:var(--muted)}

/* ── 버튼 ───────────────────────── */
.btn{
  width:100%;
  background:var(--accent);
  color:#FFF8EC;
  border:none;
  border-radius:11px;
  padding:14px;
  font-weight:700;
  letter-spacing:.02em;
}
.btn:disabled{opacity:.5}
.btn.ghost{
  background:transparent;
  color:var(--accent);
  border:1px solid var(--line);
}
.btn.danger{background:transparent;color:var(--danger);border:1px solid #E0C9C0}
.btn-row{display:flex;gap:8px;margin-top:6px}

/* ── 수정 중 배너 ───────────────── */
.editbar{
  display:none;
  align-items:center;justify-content:space-between;gap:10px;
  background:#F0E4CE;border:1px solid #DFCDA9;
  border-radius:10px;padding:10px 12px;margin-bottom:16px;
  font-size:13px;
}
.editbar.on{display:flex}
.editbar button{
  background:none;border:none;color:var(--accent);
  font-weight:700;font-size:13px;text-decoration:underline;padding:0;
}

/* ── 검색·필터 ──────────────────── */
.searchwrap{position:relative;margin-bottom:10px}
.searchwrap input{padding-left:36px}
.searchwrap svg{
  position:absolute;left:11px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2
}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;
  background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:6px 13px;font-size:13px;color:var(--muted);
}
.chip.on{background:var(--accent);border-color:var(--accent);color:#FFF8EC;font-weight:700}
.count{font-size:12.5px;color:var(--muted);margin:2px 0 12px}

/* ── 기록 카드 ──────────────────── */
.card{
  width:100%;text-align:left;
  background:var(--card);
  border:1px solid var(--line);
  border-left:3px solid var(--accent);
  border-radius:var(--radius);
  padding:14px 15px;
  margin-bottom:10px;
}
.card:active{background:#F9F3E6}
.card .bean{
  font-family:var(--serif);font-weight:700;font-size:17.5px;
  letter-spacing:-.01em;line-height:1.35;
  word-break:break-word;
}
.card .meta{font-size:12.5px;color:var(--muted);margin-top:5px}
.card .cup{font-size:13px;color:#6B5B4E;margin-top:6px}
.card .note{font-size:13.5px;margin-top:4px;color:#4A3D34}
.mini{display:inline-flex;gap:2px;vertical-align:-2px;margin-right:5px}
.mini svg{width:12px;height:12px}
.mini .shell{fill:var(--line)}
.mini .on .shell{fill:var(--bean)}
.mini .crack{display:none}

/* ── 빈 화면 ────────────────────── */
.empty{
  text-align:center;padding:56px 20px;color:var(--muted);
}
.empty .big{font-family:var(--serif);font-size:17px;color:var(--ink);margin-bottom:6px}

/* ── 상세 시트 ──────────────────── */
.sheet-bg{
  display:none;position:fixed;inset:0;background:rgba(46,38,34,.42);
  z-index:40;
}
.sheet-bg.on{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;
  background:var(--paper);
  border-radius:20px 20px 0 0;
  padding:8px 20px calc(22px + env(safe-area-inset-bottom));
  max-height:86vh;overflow-y:auto;
  transform:translateY(100%);
  transition:transform .22s ease;
}
.sheet.on{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.grab{width:38px;height:4px;background:var(--line);border-radius:2px;margin:6px auto 16px}
.sheet h2{
  font-family:var(--serif);font-size:21px;margin:0 0 4px;letter-spacing:-.01em;
}
.sheet .sub{font-size:13px;color:var(--muted);margin-bottom:16px}
.row{border-top:1px solid var(--line);padding:12px 0}
.row .k{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin-bottom:3px}
.row .v{white-space:pre-wrap;word-break:break-word}

/* ── 확인창 ─────────────────────── */
.modal{
  display:none;position:fixed;inset:0;z-index:60;
  background:rgba(46,38,34,.42);
  align-items:center;justify-content:center;padding:28px;
}
.modal.on{display:flex}
.modal .box{
  background:var(--card);border-radius:16px;padding:22px 20px 16px;
  max-width:340px;width:100%;
}
.modal h3{font-family:var(--serif);margin:0 0 8px;font-size:18px}
.modal p{margin:0 0 18px;font-size:13.5px;color:var(--muted)}

/* ── 탭바 ───────────────────────── */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:flex;
  background:var(--card);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1;background:none;border:none;
  padding:11px 0 13px;
  color:var(--muted);font-size:11.5px;letter-spacing:.04em;
}
nav button svg{display:block;margin:0 auto 3px;width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7}
nav button.on{color:var(--accent);font-weight:700}

/* ── 토스트 ─────────────────────── */
#toast{
  position:fixed;left:50%;bottom:96px;transform:translate(-50%,14px);
  background:var(--ink);color:#F6F0E4;
  padding:11px 18px;border-radius:999px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:.2s;z-index:70;
  max-width:88vw;text-align:center;
}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ── 설정 안내 ──────────────────── */
.setup{
  background:#F5E3DC;border:1px solid #E0C0B4;color:#7A3B26;
  border-radius:12px;padding:14px;font-size:13px;margin-bottom:18px;
}
.setup code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>

<header>
  <h1>커피 노트</h1>
  <p>오늘 마신 한 잔을 남겨 두는 곳</p>
</header>

<main>
  <!-- ══ 기록 탭 ══════════════════ -->
  <section id="v-write" class="view on">
    <div id="setup" class="setup" style="display:none">
      설정이 아직 안 끝났습니다. 파일 위쪽 <code>API_URL</code>에 Apps Script 배포 주소를 넣어 주세요.
    </div>

    <div id="editbar" class="editbar">
      <span id="editbar-txt">기록을 고치는 중</span>
      <button type="button" onclick="cancelEdit()">취소</button>
    </div>

    <div class="field">
      <label class="lb" for="f-date">날짜</label>
      <input type="date" id="f-date">
    </div>

    <div class="field">
      <label class="lb" for="f-bean">원두명</label>
      <input type="text" id="f-bean" list="beanlist" placeholder="예: 에티오피아 예가체프" autocomplete="off">
      <datalist id="beanlist"></datalist>
    </div>

    <div class="field">
      <label class="lb" for="f-cup">컵노트</label>
      <input type="text" id="f-cup" placeholder="예: 자몽, 홍차, 다크초콜릿">
    </div>

    <div class="field">
      <label class="lb" for="f-place">마신 장소</label>
      <input type="text" id="f-place" list="placelist" placeholder="예: 집, ○○로스터리" autocomplete="off">
      <datalist id="placelist"></datalist>
    </div>

    <div class="field">
      <label class="lb" for="f-my">내 느낌</label>
      <textarea id="f-my" placeholder="맛, 향, 그날의 기분까지"></textarea>
    </div>

    <div class="field">
      <span class="lb">평점</span>
      <div style="display:flex">
        <div class="rating" id="rating"></div>
        <span class="rate-txt" id="rate-txt">아직 선택 안 함</span>
      </div>
    </div>

    <button class="btn" id="save" onclick="save()">기록 저장</button>
  </section>

  <!-- ══ 목록 탭 ══════════════════ -->
  <section id="v-list" class="view">
    <div class="searchwrap">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      <input type="text" id="q" placeholder="원두명 · 장소 · 컵노트 검색" oninput="render()" autocomplete="off">
    </div>

    <div class="chips" id="chips-rate">
      <button class="chip on" data-r="0" onclick="setRate(this)">평점 전체</button>
      <button class="chip" data-r="5" onclick="setRate(this)">5점</button>
      <button class="chip" data-r="4" onclick="setRate(this)">4점 이상</button>
      <button class="chip" data-r="3" onclick="setRate(this)">3점 이상</button>
    </div>
    <div class="chips" id="chips-term">
      <button class="chip on" data-t="0" onclick="setTerm(this)">기간 전체</button>
      <button class="chip" data-t="30" onclick="setTerm(this)">최근 1개월</button>
      <button class="chip" data-t="90" onclick="setTerm(this)">최근 3개월</button>
      <button class="chip" data-t="365" onclick="setTerm(this)">최근 1년</button>
    </div>

    <p class="count" id="count"></p>
    <div id="list"></div>
  </section>
</main>

<!-- ══ 상세 시트 ══ -->
<div class="sheet-bg" id="sheet-bg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="d-bean">
  <div class="grab"></div>
  <h2 id="d-bean"></h2>
  <div class="sub" id="d-sub"></div>
  <div id="d-body"></div>
  <div class="btn-row" style="margin-top:18px">
    <button class="btn ghost" onclick="copyForBlog()">블로그용 복사</button>
    <button class="btn ghost" onclick="startEdit()">수정</button>
  </div>
  <div class="btn-row">
    <button class="btn danger" onclick="askDelete()">삭제</button>
  </div>
</div>

<!-- ══ 삭제 확인 ══ -->
<div class="modal" id="confirm">
  <div class="box">
    <h3>이 기록을 삭제할까요?</h3>
    <p>앱에서는 되돌릴 수 없습니다. 실수로 지웠다면 구글 시트의 <b>파일 → 버전 기록</b>에서 복구하세요.</p>
    <div class="btn-row">
      <button class="btn ghost" onclick="closeConfirm()">취소</button>
      <button class="btn danger" onclick="doDelete()">삭제</button>
    </div>
  </div>
</div>

<nav>
  <button id="t-write" class="on" onclick="tab('write')">
    <svg viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M14.5 4.5l5 5L9 20H4v-5z"/></svg>기록
  </button>
  <button id="t-list" onclick="tab('list')">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>목록
  </button>
</nav>

<div id="toast"></div>

<script>
/* ════════════════════════════════════════
   설정 — 이 두 줄만 확인하세요
   ════════════════════════════════════════ */
const API_URL = 'https://script.google.com/macros/s/AKfycbz14cVemZ2_v-f51ATGV2F921MhOfBGVafAK9j9rqaT4wMzgCg709nMmcWUxbOVnqO6/exec';                 // ← Apps Script 배포 주소(.../exec)를 따옴표 안에 붙여넣으세요
const SECRET  = 'ohscoffeenote';    // Apps Script의 SECRET과 같아야 합니다
/* ══════════════════════════════════════ */

const BEAN =
  '<ellipse class="shell" cx="12" cy="12" rx="7.4" ry="9.6" transform="rotate(-28 12 12)"/>' +
  '<path class="crack" d="M8.4 17.6c2.6-1.4 3.4-3.6 3.2-5.7-.2-2.1-1.2-4-3.3-5.3" ' +
  'transform="rotate(-28 12 12)" stroke-linecap="round" fill="none"/>';

let records = [];      // 시트에서 읽어온 전체 기록
let rating  = 0;       // 폼의 현재 평점
let editId  = null;    // 수정 중인 기록 id (null이면 새 기록)
let curId   = null;    // 상세 시트에 열린 기록 id
let fRate   = 0;       // 평점 필터
let fTerm   = 0;       // 기간 필터(일)

const $ = id => document.getElementById(id);

/* ── 통신 ─────────────────────── */
async function api(body){
  if(!API_URL){ throw new Error('API_URL이 비어 있습니다'); }
  const res = await fetch(API_URL, {
    method:'POST',
    body: JSON.stringify(Object.assign({secret:SECRET}, body))
  });
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || '알 수 없는 오류');
  return json;
}

/* ── 시작 ─────────────────────── */
function init(){
  $('f-date').value = today();
  buildRating();
  if(!API_URL){ $('setup').style.display='block'; return; }
  load();
}

async function load(){
  try{
    const r = await api({action:'list'});
    records = (r.rows||[]).map(row => {
      row.date = toISO(row.date);
      return row;
    }).sort((a,b)=> String(b.date).localeCompare(String(a.date)));
    fillDatalists();
    render();
  }catch(e){
    toast('기록을 불러오지 못했습니다 · ' + e.message);
  }
}

/* 시트에서 오는 날짜는 형식이 제각각이라 여기서 2026-08-20 형태로 통일 */
function toISO(v){
  if(!v) return '';
  const s = String(v).trim();
  const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return m[1] + '-' + pad(m[2]) + '-' + pad(m[3]);
  // "Thu Aug 20 2026 00:00:00 GMT+0900 (한국 표준시)" 같은 형태 — 시간대 변환 없이 글자 그대로 읽는다
  const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const t = s.match(/\b([A-Z][a-z]{2})\s+(\d{1,2})\s+(\d{4})\b/);
  if(t && MON.indexOf(t[1]) >= 0){
    return t[3] + '-' + pad(MON.indexOf(t[1]) + 1) + '-' + pad(t[2]);
  }
  const d = new Date(s.replace(/\s*\(.*\)\s*$/, ''));
  if(!isNaN(d.getTime())){
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  }
  return s;
}
function pad(n){ return String(n).padStart(2,'0'); }

/* 화면에 보여줄 때: 올해면 "8월 20일", 지난해면 "2025년 8월 20일" */
function fmtDate(iso){
  const m = String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return String(iso||'');
  const y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
  const txt = mo + '월 ' + d + '일';
  return y === new Date().getFullYear() ? txt : y + '년 ' + txt;
}

function today(){
  const d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
}

/* ── 평점 위젯 ────────────────── */
function buildRating(){
  const box = $('rating');
  box.innerHTML = '';
  for(let i=1;i<=5;i++){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'beanbtn' + (i<=rating ? ' on' : '');
    b.setAttribute('aria-label', i + '점');
    b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + BEAN + '</svg>';
    b.onclick = () => { rating = (rating===i ? i-1 : i); buildRating(); };
    box.appendChild(b);
  }
  $('rate-txt').textContent = rating ? rating + ' / 5' : '아직 선택 안 함';
}

function miniBeans(n){
  n = Number(n) || 0;
  let s = '<span class="mini" aria-label="평점 '+n+'점">';
  for(let i=1;i<=5;i++){
    s += '<svg viewBox="0 0 24 24" class="'+(i<=n?'on':'')+'" aria-hidden="true">'+BEAN+'</svg>';
  }
  return s + '</span>';
}

/* ── 저장 ─────────────────────── */
async function save(){
  const data = {
    date:    $('f-date').value,
    bean:    $('f-bean').value.trim(),
    cupNote: $('f-cup').value.trim(),
    place:   $('f-place').value.trim(),
    myNote:  $('f-my').value.trim(),
    rating:  rating
  };
  if(!data.date){ toast('날짜를 넣어 주세요'); return; }
  if(!data.bean){ toast('원두명을 넣어 주세요'); $('f-bean').focus(); return; }

  const btn = $('save');
  btn.disabled = true;
  btn.textContent = editId ? '수정하는 중…' : '저장하는 중…';
  try{
    if(editId){
      await api({action:'update', id:editId, data:data});
      toast('수정했습니다');
    }else{
      await api({action:'add', data:data});
      toast('저장했습니다');
    }
    resetForm();
    await load();
    tab('list');
  }catch(e){
    toast('저장하지 못했습니다 · ' + e.message);
  }finally{
    btn.disabled = false;
    btn.textContent = editId ? '수정 저장' : '기록 저장';
  }
}

function resetForm(){
  editId = null;
  rating = 0;
  $('f-date').value = today();
  ['f-bean','f-cup','f-place','f-my'].forEach(id => $(id).value = '');
  buildRating();
  $('editbar').classList.remove('on');
  $('save').textContent = '기록 저장';
}
function cancelEdit(){ resetForm(); toast('수정을 취소했습니다'); }

/* ── 자동완성 ─────────────────── */
function fillDatalists(){
  const put = (elId, key) => {
    const seen = [];
    records.forEach(r => {
      const v = String(r[key]||'').trim();
      if(v && seen.indexOf(v) < 0) seen.push(v);
    });
    $(elId).innerHTML = seen.map(v => '<option value="'+esc(v)+'">').join('');
  };
  put('beanlist','bean');
  put('placelist','place');
}

/* ── 목록 ─────────────────────── */
function setRate(el){
  fRate = Number(el.dataset.r);
  [...$('chips-rate').children].forEach(c => c.classList.toggle('on', c===el));
  render();
}
function setTerm(el){
  fTerm = Number(el.dataset.t);
  [...$('chips-term').children].forEach(c => c.classList.toggle('on', c===el));
  render();
}

function filtered(){
  const q = $('q').value.trim().toLowerCase();
  let limit = null;
  if(fTerm){
    const d = new Date();
    d.setDate(d.getDate() - fTerm);
    limit = d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  }
  return records.filter(r => {
    if(fRate && Number(r.rating||0) < fRate) return false;
    if(limit && String(r.date) < limit) return false;
    if(q){
      const hay = [r.bean, r.place, r.cupNote, r.myNote].join(' ').toLowerCase();
      if(hay.indexOf(q) < 0) return false;
    }
    return true;
  });
}

function render(){
  const rows = filtered();
  const box = $('list');
  $('count').textContent = records.length
    ? rows.length + '잔' + (rows.length !== records.length ? ' (전체 ' + records.length + '잔 중)' : '')
    : '';

  if(!records.length){
    box.innerHTML = '<div class="empty"><div class="big">아직 기록이 없습니다</div>기록 탭에서 첫 잔을 남겨 보세요.</div>';
    return;
  }
  if(!rows.length){
    box.innerHTML = '<div class="empty"><div class="big">조건에 맞는 기록이 없습니다</div>검색어나 필터를 바꿔 보세요.</div>';
    return;
  }

  box.innerHTML = rows.map(r => {
    const line = [fmtDate(r.date), r.place].filter(Boolean).join(' · ');
    return '<button class="card" onclick="openSheet(\'' + esc(r.id) + '\')">' +
      '<div class="bean">' + esc(r.bean || '(원두명 없음)') + '</div>' +
      '<div class="meta">' + miniBeans(r.rating) + esc(line) + '</div>' +
      (r.cupNote ? '<div class="cup">' + esc(cut(r.cupNote, 46)) + '</div>' : '') +
      (r.myNote ? '<div class="note">' + esc(cut(r.myNote, 55)) + '</div>' : '') +
      '</button>';
  }).join('');
}

function cut(s, n){ s = String(s); return s.length > n ? s.slice(0,n) + '…' : s; }
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function find(id){ return records.find(r => String(r.id) === String(id)); }

/* ── 상세 시트 ────────────────── */
function openSheet(id){
  const r = find(id);
  if(!r) return;
  curId = id;
  $('d-bean').textContent = r.bean || '(원두명 없음)';
  $('d-sub').innerHTML = miniBeans(r.rating) + esc([fmtDate(r.date), r.place].filter(Boolean).join(' · '));
  const rows = [];
  if(r.cupNote) rows.push(['컵노트', r.cupNote]);
  if(r.myNote)  rows.push(['내 느낌', r.myNote]);
  $('d-body').innerHTML = rows.map(([k,v]) =>
    '<div class="row"><div class="k">' + k + '</div><div class="v">' + esc(v) + '</div></div>'
  ).join('');
  $('sheet-bg').classList.add('on');
  $('sheet').classList.add('on');
}
function closeSheet(){
  $('sheet-bg').classList.remove('on');
  $('sheet').classList.remove('on');
  curId = null;
}

/* ── 수정 ─────────────────────── */
function startEdit(){
  const r = find(curId);
  if(!r) return;
  editId = r.id;
  $('f-date').value  = toISO(r.date) || today();
  $('f-bean').value  = r.bean || '';
  $('f-cup').value   = r.cupNote || '';
  $('f-place').value = r.place || '';
  $('f-my').value    = r.myNote || '';
  rating = Number(r.rating) || 0;
  buildRating();
  $('editbar-txt').textContent = '"' + cut(r.bean || '기록', 16) + '" 고치는 중';
  $('editbar').classList.add('on');
  $('save').textContent = '수정 저장';
  closeSheet();
  tab('write');
  window.scrollTo(0,0);
}

/* ── 삭제 ─────────────────────── */
let delId = null;
function askDelete(){ delId = curId; $('confirm').classList.add('on'); }
function closeConfirm(){ $('confirm').classList.remove('on'); delId = null; }

async function doDelete(){
  const id = delId;
  closeConfirm();
  if(!id) return;
  try{
    await api({action:'delete', id:id});
    closeSheet();
    toast('삭제했습니다');
    await load();
  }catch(e){
    toast('삭제하지 못했습니다 · ' + e.message);
  }
}

/* ── 블로그용 복사 ────────────── */
function blogText(r){
  const beans = '●'.repeat(Number(r.rating)||0) + '○'.repeat(5 - (Number(r.rating)||0));
  const lines = [];
  lines.push('☕ ' + (r.bean || ''));
  lines.push([fmtDate(r.date), r.place].filter(Boolean).join(' · '));
  lines.push('');
  if(r.cupNote) lines.push('컵노트 | ' + r.cupNote);
  lines.push('평점 | ' + beans + ' (' + (Number(r.rating)||0) + '/5)');
  if(r.myNote){ lines.push(''); lines.push(r.myNote); }
  return lines.join('\n');
}

function copyForBlog(){
  const r = find(curId);
  if(!r) return;
  const text = blogText(r);
  const done = () => toast('복사했습니다 · 블로그에 붙여넣으세요');
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  }else{
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); done(); }
  catch(e){ toast('복사가 안 됩니다 · 길게 눌러 직접 복사해 주세요'); }
  document.body.removeChild(ta);
}

/* ── 탭 · 토스트 ──────────────── */
function tab(name){
  $('v-write').classList.toggle('on', name === 'write');
  $('v-list').classList.toggle('on',  name === 'list');
  $('t-write').classList.toggle('on', name === 'write');
  $('t-list').classList.toggle('on',  name === 'list');
  window.scrollTo(0,0);
}

let toastTimer = null;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2600);
}

document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    if($('confirm').classList.contains('on')) closeConfirm();
    else if(curId) closeSheet();
  }
});

init();
</script>
